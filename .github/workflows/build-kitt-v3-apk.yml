name: Build KITT v3 Android APK
# voice-sync patch revision 2

on:
  push:
    paths:
      - '.github/workflows/build-kitt-v3-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout payload
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore KITT v2 project
        shell: bash
        run: |
          cat kitt-build/parts/part*.b64 > /tmp/kitt.b64
          base64 -d /tmp/kitt.b64 > /tmp/kitt.zip
          unzip -q /tmp/kitt.zip -d "$GITHUB_WORKSPACE"

      - name: Apply KITT v3 voice sync patch
        run: python kitt-v3-build/patch.py

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: JARVIS_FERDI_ANDROID
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare final APK
        shell: bash
        run: cp JARVIS_FERDI_ANDROID/app/build/outputs/apk/debug/app-debug.apk KITT_FERDI_v3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KITT_FERDI_V3_APK
          path: KITT_FERDI_v3.apk
          if-no-files-found: error
