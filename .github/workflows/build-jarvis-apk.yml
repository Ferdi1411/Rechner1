name: Build JARVIS Android APK

on:
  push:
    paths:
      - '.github/workflows/build-jarvis-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout build payload
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore JARVIS Android project
        shell: bash
        run: |
          cat jarvis-build/parts/part1.b64 jarvis-build/parts/part2.b64 jarvis-build/parts/part3a.b64 jarvis-build/parts/part3b.b64 jarvis-build/parts/part4.b64 jarvis-build/parts/part5.b64 jarvis-build/parts/part6.b64 > /tmp/jarvis.b64
          base64 -d /tmp/jarvis.b64 > /tmp/jarvis.zip
          unzip -q /tmp/jarvis.zip -d "$GITHUB_WORKSPACE"

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: JARVIS_FERDI_ANDROID
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare final APK
        shell: bash
        run: cp JARVIS_FERDI_ANDROID/app/build/outputs/apk/debug/app-debug.apk JARVIS_FERDI.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS_FERDI_APK
          path: JARVIS_FERDI.apk
          if-no-files-found: error
